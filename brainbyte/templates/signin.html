<!DOCTYPE html>
<html lang="en">
<head>
  <title>BrainByte</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='signin.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</head>
<body>

<header class="menu">
  <div id="system-terminal" class="system-terminal" style="display: none;"></div>
  <div class="menu-left">
      <div class="icon">
          <img src="/static/brain.png" alt="BrainByte Logo">
      </div>

      <a href="/" class="si-buttons-scifi__style-5__button-2">
          <span>Home</span>
          <helper-1></helper-1>
          <helper-2></helper-2>
          <shine></shine>
          <ripple></ripple>
      </a>
      <a href="/about" class="si-buttons-scifi__style-5__button-2">
          <span>About us</span>
          <helper-1></helper-1>
          <helper-2></helper-2>
          <shine></shine>
          <ripple></ripple>
      </a>
      <a href="/news" class="si-buttons-scifi__style-5__button-2">
          <span>News</span>
          <helper-1></helper-1>
          <helper-2></helper-2>
          <shine></shine>
          <ripple></ripple>
      </a>
      <a href="/contact" class="si-buttons-scifi__style-5__button-2">
          <span>Contact</span>
          <helper-1></helper-1>
          <helper-2></helper-2>
          <shine></shine>
          <ripple></ripple>
      </a>
  </div>

  <div class="menu-right">
    {% if not logged_in %}
        <a href="/signin" class="si-buttons-scifi__style-5__button-2">
            <span>Sign in</span>
            <helper-1></helper-1>
            <helper-2></helper-2>
            <shine></shine>
            <ripple></ripple>
        </a>
        <a href="/login" class="si-buttons-scifi__style-5__button-2">
            <span>Login</span>
            <helper-1></helper-1>
            <helper-2></helper-2>
            <shine></shine>
            <ripple></ripple>
        </a>
    {% else %}
        <a href="/map" class="si-buttons-scifi__style-5__button-2">
            <span>Play Game</span>
            <helper-1></helper-1>
            <helper-2></helper-2>
            <shine></shine>
            <ripple></ripple>
        </a>
        <a href="/logout" class="si-buttons-scifi__style-5__button-2">
            <span>Logout</span>
            <helper-1></helper-1>
            <helper-2></helper-2>
            <shine></shine>
            <ripple></ripple>
        </a>
    {% endif %}
  </div>
</header>


<div class="centered-form">
  <div class="form-container">
    <h2>New account</h2>
    <form action="/signup" method="POST">

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="username" placeholder="Choose a Username" name="username" required>
        <label for="username">Username</label>
    </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="email" placeholder="Enter email" name="email" required>
        <label for="email">Email</label>
      </div>

      <div class="form-floating mb-4 password-wrapper">
        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required>
        <label for="pwd">Password</label>
        
        <i class="bi bi-eye toggle-password" onclick="togglePassword(this)"></i>
      </div>
      
      <div class="password-strength mt-2">
        <div class="progress">
          <div id="strength-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <small id="strength-text" class="text-muted">Password strength</small>
      </div>

      <ul class="password-rules">
      <li id="rule-length">At least 8 characters</li>
      <li id="rule-upper">At least 1 uppercase letter</li>
      <li id="rule-number">At least 1 number</li>
      <li id="rule-special">At least 1 special character</li>
      </ul>

      <!--
      <button type="submit" class="btn-custom">Sign in</button>
      -->
      <form action="/signup" method="POST">
        <button type="submit" class="si">
            <span>Sign in</span>
            <helper-1></helper-1>
            <helper-2></helper-2>
            <shine></shine>
            <ripple></ripple>
        </button>
      </form>
    </form>
  </div>
</div>

<script>
function togglePassword(icon) {
  const passwordInput = document.getElementById('pwd');

  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');
  } else {
    passwordInput.type = 'password';
    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');
  }
}
</script>
<script>
const pwdInput = document.getElementById("pwd");
const strengthBar = document.getElementById("strength-bar");
const strengthText = document.getElementById("strength-text");

pwdInput.addEventListener("input", function () {
  const value = pwdInput.value;

  const rules = {
    length: value.length >= 8,
    upper: /[A-Z]/.test(value),
    number: /\d/.test(value),
    special: /[!@#$%^&*]/.test(value)
  };

  setRule("rule-length", rules.length);
  setRule("rule-upper", rules.upper);
  setRule("rule-number", rules.number);
  setRule("rule-special", rules.special);

  updateStrength(Object.values(rules).filter(Boolean).length);
});

function setRule(id, valid) {
  const el = document.getElementById(id);
  el.classList.toggle("valid", valid);
}

function updateStrength(score) {
  if (pwdInput.value.length === 0) {
    strengthBar.style.width = "0%";
    strengthBar.className = "progress-bar";
    strengthText.textContent = "Password strength";
    return;
  }

  if (score <= 1) {
    strengthBar.style.width = "33%";
    strengthBar.className = "progress-bar bg-danger";
    strengthText.textContent = "Weak";
  } else if (score <= 3) {
    strengthBar.style.width = "66%";
    strengthBar.className = "progress-bar bg-warning";
    strengthText.textContent = "Medium";
  } else {
    strengthBar.style.width = "100%";
    strengthBar.className = "progress-bar bg-success";
    strengthText.textContent = "Strong";
  }
}
</script>
{% if error %}
<script>
    window.addEventListener('load', function() {
        const terminal = document.getElementById('system-terminal');
        if (terminal) {
            terminal.innerText = "{{ error }}";
            terminal.style.display = 'block';
            terminal.classList.add('terminal-flicker');
            
            setTimeout(() => {
                terminal.style.display = 'none';
                terminal.classList.remove('terminal-flicker');
            }, 3000);
        }
    });
</script>
{% endif %}


</body>
</html>
